<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halalar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2efe9;--paper:#0b0b0d;--accent:#1f22ff;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;overscroll-behavior:none;touch-action:none;height:100%;background:var(--paper);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}
body{height:100vh;overflow:hidden}
body.locked{overflow:hidden}
#cover{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity 1s,visibility 1s}
#cover.gone{opacity:0;visibility:hidden}
.small{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
#cover h1{font-family:Fraunces,serif;font-weight:300;font-size:clamp(54px,11vw,170px);letter-spacing:-.03em;line-height:.9;text-align:center}
#cover p{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:clamp(18px,2.4vw,28px);color:#333}
#cover button{border:1px solid var(--ink);background:none;padding:14px 38px;border-radius:999px;font:500 13px/1 "Space Grotesk";letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.3s}
#cover button:hover{background:var(--ink);color:#fff}
nav{position:fixed;top:0;left:0;right:0;z-index:60;transform:translateZ(0);text-shadow:0 1px 8px rgba(0,0,0,.9);display:flex;justify-content:space-between;align-items:center;padding:22px 32px;pointer-events:none}
nav .logo{font-family:Fraunces,serif;font-size:26px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;pointer-events:auto}
nav .depth{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
/* ---- tünel ---- */
#world{position:fixed;inset:0;z-index:1;isolation:isolate;perspective:600px;perspective-origin:50% 50%;overflow:hidden}
#cam{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.obj{position:absolute;left:50%;top:50%;transform-style:preserve-3d;cursor:pointer;pointer-events:auto;will-change:transform,opacity}
.obj img{display:block;width:100%;filter:drop-shadow(0 30px 50px rgba(0,0,0,.7));pointer-events:auto}

.vignette{display:none}
/* detay kartı */
#card{position:fixed;z-index:45;background:#f2efe9;color:#111;padding:10px 13px;border-radius:10px;width:210px;z-index:70;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#card.on{opacity:1;transform:none}
#card .k{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#666}
#card h3{font-family:Fraunces,serif;font-weight:400;font-size:18px;letter-spacing:-.01em;margin:3px 0 4px;line-height:1.1}
#card p{font-size:12px;color:#333;line-height:1.35}
#card .go{display:block;margin-top:6px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#111}
.hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);z-index:40;transition:.6s}
.hint.off{opacity:0}
#end{position:fixed;inset:0;display:grid;place-items:center;z-index:30;opacity:0;pointer-events:none;transition:.8s;font-family:Fraunces,serif;font-weight:600;font-size:clamp(70px,20vw,320px);letter-spacing:-.05em;color:var(--accent)}
#end.on{opacity:1}
</style>
</head>
<body>

<div id="world"><div id="cam"></div></div>
<div class="vignette"></div>
<div id="card"><div class="k" id="c-k"></div><h3 id="c-h"></h3><p id="c-p"></p><span class="go">Ürün sayfası →</span></div>
<div class="hint" id="hint">kaydır ↓ içeri gir</div>

<script>

<script>
// Her ürüne tünelde bir yer: z (derinlik), x/y (yana ofset), boyut. Deterministik dağılım.
const ASPECT={"3484": 1.5, "3490": 1.2, "3491": 1.0, "3485": 0.84, "3493": 0.59, "3487": 0.46, "3478": 1.01, "3479": 0.73, "3486": 0.81, "3492": 1.02, "3482": 0.55, "3469": 0.44, "3468": 0.71, "3483": 1.07, "3481": 0.62, "3495": 0.36, "3494": 0.7, "3480": 0.59, "3466": 1.08, "3472": 0.89, "3473": 0.82, "3467": 0.92, "3459": 0.67, "3471": 0.68, "3465": 1.63, "3464": 2.33, "3470": 0.47, "3474": 1.44, "3460": 0.79, "3461": 0.25, "3475": 0.68, "3488": 0.69, "3463": 0.62, "3477": 0.64, "3476": 0.72, "3462": 0.85, "3489": 0.82, "ek/3481_simitsaat": 0.97, "ek/3462_kure": 1.21, "ek/3462_sovalye": 0.74, "ek/3462_golf": 1.56, "ek/3470_kadeh": 0.95, "ek/3470_yunus": 0.34, "ek/3481_tarti": 0.7, "ek/3463_kaplumbaga": 1.06, "ek/3461_siyahfigur": 1.06, "ek/3480_cash": 0.37, "ek/3480_yildiz": 1.06, "ek/3482_papagan": 0.54, "ek/3482_tbmm": 0.73, "ek/3462_boga": 1.38, "ek/3462_ayi": 0.74, "ek/3462_kosteksaat": 0.8, "ek/3470_kurukafa": 0.47, "ek/3461_melodika": 0.21, "ek/3485_ucgen": 0.93, "ek/3461_morvazo": 0.45, "ek/3481_jant": 1.17, "ek/3463_louis": 0.91, "ek/3480_duvarsaat": 1.12, "ek/3463_geyikboynuz": 1.15, "ek/3461_heman": 0.99, "ek/3470_hindi": 0.8, "ig/ig_heykelmasa": 0.87, "ig/ig_porselentabak": 0.67, "ig/ig_yesilraf": 0.59, "ig/ig_kayak": 0.3, "ig/ig_martiniaraba": 1.92, "ig/ig_kupvazo": 0.78, "ig/ig_saveposter": 0.66, "ig/ig_hoparlor": 0.57, "ig/ig_rolls": 1.39, "ig/ig_polaroid_v2": 0.81, "ig/ig_paravan_v2": 0.66, "ig/ig_fender": 0.41, "ig/ig_alaindelon": 0.73, "ig/ig_kelebektabak": 1.37, "ig/ig_hitachi_v2": 0.93, "ig/ig_kaplan": 1.0, "ig/ig_astronot": 0.46, "ig/ig_makarateyp_v2": 0.81, "ig/ig_kurt": 0.6, "ig/ig_ledzeppelin": 0.77, "ig/ig_davul": 0.73, "ig/ig_maske": 0.86, "ig/ig_portre": 0.71};
const STEP=48;                        // ürünler arası derinlik
const TEKRAR=9;                      // liste tekrarı: tünel uzun ve dolu
const P=600;                          // perspektif (eski CSS ile aynı)
const BG='#0b0b0d';
// --- tuval: bütün tünel tek yüzeye çizilir (katman/bellek sorunu yok) ---
const world=document.getElementById('world'); world.innerHTML='';
const cv=document.createElement('canvas'); cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block';
world.appendChild(cv); const g=cv.getContext('2d');
let DPR=1,VW=0,VH=0;
function boyut(){DPR=Math.min(window.devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR)}
boyut(); addEventListener('resize',boyut);
// --- görseller: her ürün bir kez yüklenir, alfa haritası çıkarılır ---
const IMG={}, ALPHA={};
URUNLER.forEach(u=>{ if(IMG[u[0]])return; const im=new Image(); im.src=`kaynak/web/${u[0]}.webp`; IMG[u[0]]=im;
  im.decode().then(()=>{const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);ALPHA[u[0]]=x.getImageData(0,0,48,48).data}).catch(()=>{}) });
// --- yerleşim (önceki ile aynı kurallar) ---
const LISTE=[];for(let t=0;t<TEKRAR;t++)URUNLER.forEach(u=>LISTE.push(u));
const N=LISTE.length;
const items=LISTE.map((u,i)=>{
  const ar=ASPECT[u[0]]||1;
  const X=1.4, Y=1.35, per=2*(2*X+2*Y);            // çerçeve çevresine eşit dağılım
  const p=((i*0.6180339)%1)*per;
  const inn=((i*0.4142)%1)*0.35;
  let xv,yv;
  if(p<2*X){xv=-X+p; yv=-Y+inn}
  else if(p<2*X+2*Y){xv=X-inn; yv=-Y+(p-2*X)}
  else if(p<4*X+2*Y){xv=X-(p-2*X-2*Y); yv=Y-inn}
  else {xv=-X+inn; yv=Y-(p-4*X-2*Y)}
  const w=(ar>1.25?410:ar<0.75?270:340)+((i*13)%6)*38;
  const z=-(i*STEP)-250;
  let rot=0;
  if(ar<0.75){ const mag=9+((i*0.7548)%1)*11; const side=Math.abs(xv)>Math.abs(yv)?Math.sign(xv):(((i*0.31)%1)<0.5?-1:1); rot=-side*mag; }
  else rot=(((i*0.5698)%1)-0.5)*4;
  return {i,u,x:xv,y:yv,z,w,ar,rot:rot*Math.PI/180,thin:(i%3!==0),
          sx:0,sy:0,sw:0,sh:0,op:0,dz:0};
});
const TOTAL=(N+1)*STEP;
const THIN_Z=1100;
let mx=0,my=0; addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5);my=(e.clientY/innerHeight-.5)});
let camZ=0,target=0,open=true;
const clamp=v=>Math.min(Math.max(v,0),TOTAL);
addEventListener('wheel',e=>{if(!open)return;e.preventDefault();
  if(Math.abs(e.deltaY)<2)return;
  if(target<=0&&e.deltaY<0){target=0;return}
  target=clamp(target+e.deltaY*1.4)},{passive:false});
let ty=null;addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(!open||ty===null)return;const y=e.touches[0].clientY;target=clamp(target+(ty-y)*3);ty=y;e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{if(!open)return;if(e.key==='ArrowDown'||e.key===' '||e.key==='PageDown')target=clamp(target+400);if(e.key==='ArrowUp'||e.key==='PageUp')target=clamp(target-400)});
let drawn=[];                       // bu karede çizilenler, uzaktan yakına
function render(){
  camZ+=(target-camZ)*0.12; if(Math.abs(target-camZ)<0.05)camZ=target;
  document.getElementById('depth').textContent=Math.round(camZ/40)+' m';
  document.getElementById('hint').classList.toggle('off',camZ>200);
  const cx=mx*-60, cy=my*-40;
  drawn=[];
  for(const it of items){
    const dz=it.z+camZ; it.dz=dz;
    if(dz>250||dz<-7000)continue;
    let vis=1;
    if(dz>0) vis*=Math.max(0,(250-dz)/250);
    if(dz<-5500) vis*=Math.max(0,(7000+dz)/1500);
    if(it.thin) vis*=Math.min(1,Math.max(0,(dz+THIN_Z+500)/500));
    if(vis<=0.01)continue;
    const im=IMG[it.u[0]]; if(!im.complete||!im.naturalWidth)continue;
    const fog=Math.min(1,Math.max(0,(-dz-2000)/10000));
    const k=P/(P-dz);
    it.op=(1-fog*0.6)*vis;
    it.sw=it.w*k; it.sh=it.sw*im.naturalHeight/im.naturalWidth;
    it.sx=VW/2+(it.x*VW*0.5+cx)*k; it.sy=VH/2+(it.y*VH*0.5+cy)*k;
    if(it.sx+it.sw<-50||it.sx-it.sw>VW+50||it.sy+it.sh<-50||it.sy-it.sh>VH+50)continue;  // ekran dışı
    drawn.push(it);
  }
  drawn.sort((a,b)=>a.dz-b.dz);
  g.setTransform(DPR,0,0,DPR,0,0); g.globalAlpha=1; g.fillStyle=BG; g.fillRect(0,0,VW,VH);
  for(const it of drawn){
    g.save(); g.globalAlpha=it.op; g.translate(it.sx,it.sy); g.rotate(it.rot);
    g.drawImage(IMG[it.u[0]],-it.sw/2,-it.sh/2,it.sw,it.sh); g.restore();
  }
  document.getElementById('end').classList.toggle('on',camZ>TOTAL-STEP*1.2);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);
// --- seçim: o noktada gerçekten görünen, en öndeki ürün ---
const card=document.getElementById('card'); let hoverT=null,hot=null;
function pickIs(it,x,y){
  const d=ALPHA[it.u[0]]; if(!d||it.op<0.05)return false;
  const dx=x-it.sx, dy=y-it.sy, c=Math.cos(it.rot), s=Math.sin(it.rot);
  const lx_=dx*c+dy*s, ly_=-dx*s+dy*c;                 // eğimi geri al
  const u=Math.floor((lx_/it.sw+0.5)*48), v=Math.floor((ly_/it.sh+0.5)*48);
  if(u<0||u>47||v<0||v>47)return false; return d[(v*48+u)*4+3]>40}
function pick(x,y){ for(let j=drawn.length-1;j>=0;j--){ if(pickIs(drawn[j],x,y))return drawn[j] } return null }
function showCard(it){card.style.left=Math.min(lx+16,innerWidth-230)+'px';card.style.top=Math.min(ly+16,innerHeight-110)+'px';document.getElementById('c-k').textContent=it.u[3];document.getElementById('c-h').textContent=it.u[1];document.getElementById('c-p').textContent=it.u[2];card.classList.add('on')}
let cand=null,candT=0,offT=null;
function setHot(o){
  if(o===hot){clearTimeout(offT);offT=null;cand=null;return}
  if(!o){ if(!offT) offT=setTimeout(()=>{hot=null;cand=null;card.classList.remove('on');cv.style.cursor='';offT=null},250); return }
  clearTimeout(offT);offT=null;
  const now=performance.now(); if(o!==cand){cand=o;candT=now;return}
  if(now-candT<220)return;
  hot=o; cv.style.cursor='pointer'; clearTimeout(hoverT);
  if(card.classList.contains('on'))showCard(o); else hoverT=setTimeout(()=>{if(hot===o)showCard(o)},250)}
function nearHot(x,y){if(!hot||!drawn.includes(hot))return false;for(const [ox,oy] of [[0,0],[7,0],[-7,0],[0,7],[0,-7],[5,5],[-5,5],[5,-5],[-5,-5]])if(pickIs(hot,x+ox,y+oy))return true;return false}
let lx=-1,ly=-1;
function hover(){if(lx<0)return;let o=pick(lx,ly);if(!o&&nearHot(lx,ly))o=hot;setHot(o)}
addEventListener('mousemove',e=>{lx=e.clientX;ly=e.clientY;hover()});
setInterval(hover,90);
cv.addEventListener('click',e=>{const o=pick(e.clientX,e.clientY);if(o)location.href='urun.html?id='+encodeURIComponent(o.u[0])});
addEventListener('mousemove',e=>{if(!card.classList.contains('on'))return;const x=Math.min(e.clientX+16,innerWidth-230),y=Math.min(e.clientY+16,innerHeight-110);card.style.left=x+'px';card.style.top=y+'px'});
target=parseFloat(new URLSearchParams(location.search).get('z')||0);
</script>
</body>
</html>
